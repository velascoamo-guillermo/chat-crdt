apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: chat-crdt

resources:
  - ../../base
  - ../../monitoring
  - postgres.yaml
  - redis.yaml

patches:
  - path: patches/server-image.yaml
    target:
      kind: Deployment
      name: server
  - path: patches/server-service-nodeport.yaml
    target:
      kind: Service
      name: server
