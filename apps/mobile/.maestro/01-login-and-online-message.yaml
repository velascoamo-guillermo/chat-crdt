# Maestro E2E — Part 1/3: login + send one ONLINE message.
#
# Proves the "happy path" baseline before we go offline in part 2: login works, the
# WebSocketProvider connects, and an optimistically-inserted local message round-trips
# through the server while the connection is live.
#
# Prerequisites (see apps/mobile/.maestro/run.sh for the scripted version of all of this):
#   1. maestro CLI installed — https://maestro.mobile.dev
#   2. Infra up: `docker compose -f infra/docker-compose.yml up -d` (postgres + redis)
#   3. apps/server running on :3001 (`cd apps/server && bun run dev`, or
#      `apps/mobile/.maestro/scripts/server-ctl.sh start`)
#   4. Test users + a clean "default" room:
#      `apps/mobile/.maestro/scripts/server-ctl.sh reset-room` (server stopped)
#      `bun apps/mobile/.maestro/scripts/setup-users.ts` (server started)
#   5. Mobile app built and installed on the simulator, Metro running:
#      `cd apps/mobile && bun run dev` (Metro), `expo run:ios` once to install/build
#   6. Run with a fresh RUN_ID nonce so message text never collides across runs:
#      `maestro test apps/mobile/.maestro/01-login-and-online-message.yaml -e RUN_ID=$(date +%s)`
#
# "Offline" technique (used starting in part 2): we do NOT use airplane mode — it
# isn't reliably controllable on the iOS simulator (no real radio). Instead
# run.sh kills the actual apps/server process to sever the WebSocket, which
# exercises the real client reconnect path, then restarts it. Documented once here;
# see part 2/3 for where it actually happens.
#
# RED-run finding: `launchApp: clearState: true` does NOT force a logged-out state.
# expo-secure-store backs onto the iOS Keychain, which survives app-data clearing (a
# documented iOS quirk — Keychain items outlive uninstalls unless the app explicitly
# deletes them). A prior session in this ticket's manual testing landed straight on
# "# general" here, and "Tap on Email" failed with "Element not found" because the
# login screen was never shown. The `runFlow: when: visible: "# general"` guard below
# logs out through the real UI first so this flow deterministically exercises the
# login screen every run, regardless of leftover Keychain state.
appId: com.chatcrdt.app
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "# general"
    commands:
      - tapOn: "Account"
      - tapOn: "Log out"
- tapOn: "Email"
- inputText: "maestro-a@e2e.test"
- tapOn: "Password"
- inputText: "password123"
- tapOn: "Login"
- assertVisible: "# general"
- tapOn: "Message…"
- inputText: "${RUN_ID}-A-online-1"
- tapOn: "Up"
- assertVisible: "${RUN_ID}-A-online-1"
