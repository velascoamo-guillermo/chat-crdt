services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatcrdt
      POSTGRES_USER: chatcrdt
      POSTGRES_PASSWORD: chatcrdt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatcrdt -d chatcrdt"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # Redis is intentionally ephemeral — pub/sub only, no persistent state needed

volumes:
  postgres_data:
