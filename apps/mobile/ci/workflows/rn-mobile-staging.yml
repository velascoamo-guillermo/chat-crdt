# Auto-generated by rn-workflows. Do not edit by hand.
# Regenerate with: npx rn-workflows generate

name: rn-workflows • staging

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - 'apps/mobile/**'
      - 'apps/mobile/ci/workflows/rn-mobile-staging.yml'

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: apps/mobile/yarn.lock

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn expo lint

      - name: Type check
        run: yarn tsc --noEmit

      - name: Test
        run: yarn test

  build-ios:
    name: Build staging (ios)
    runs-on: macos-latest
    env:
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_API_URL: 'https://TAILSCALE_HOST'
      EXPO_PUBLIC_WS_URL: 'wss://TAILSCALE_HOST/sync'
    needs: quality
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: apps/mobile/yarn.lock

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true
          working-directory: apps/mobile

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Run Fastlane lane staging (ios)
        run: bundle exec fastlane ios staging
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_IS_BASE64: ${{ secrets.ASC_KEY_IS_BASE64 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}

