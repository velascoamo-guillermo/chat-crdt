apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        # Explicit uid so the provisioned dashboard JSON
        # (infra/k8s/monitoring/dashboards/chat-crdt-server.json) can pin its
        # panels to this exact datasource instance by id instead of relying
        # on "default datasource" resolution — the two are provisioned
        # together so an implicit link is unnecessary risk.
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: chat-crdt
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
