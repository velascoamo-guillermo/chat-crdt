# 2+ replicas so Redis fan-out (ADR-004) is actually exercised: two SyncGateway
# instances, each with its own in-memory Y.Doc per room, converging through
# Redis pub/sub. See infra/k8s/README.md for the local kind validation that
# proves this.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  labels:
    app: chat-crdt-server
spec:
  replicas: 2
  # maxUnavailable: 0 so a rollout never drops below `replicas` pods able to
  # accept new connections; maxSurge brings up the new pod first. This does
  # NOT prevent existing long-lived WS connections on a terminating pod from
  # dropping when it's replaced — clients must reconnect (see sync-engine's
  # reconnect logic client-side). terminationGracePeriodSeconds gives an
  # outgoing pod time to let SyncGateway's disconnect path run (awareness
  # cleanup, final persist) instead of being SIGKILLed mid-flight.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: chat-crdt-server
  template:
    metadata:
      labels:
        app: chat-crdt-server
      annotations:
        # Static scrape hints for the bundled Prometheus (infra/k8s/monitoring)
        # — not a ServiceMonitor, no Prometheus Operator dependency.
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # node:20-alpine's built-in `node` user — see apps/server/Dockerfile's USER
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: server
          image: chat-crdt-server
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: server-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chat-crdt-server-secrets
                  key: JWT_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chat-crdt-server-secrets
                  key: DATABASE_URL
          # /metrics needs no auth (see MetricsController) and is a cheap,
          # always-200-when-healthy endpoint — doubles as a smoke test that
          # the metrics module itself is wired correctly.
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # readOnlyRootFilesystem: true — Node/Nest/Prisma's "library" query
          # engine don't need to write anywhere under normal operation, but
          # Node itself expects a writable os.tmpdir(). Mount just that.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
