name: CI

on:
  pull_request:
    branches: [main]
  # Allow manual runs and re-validation on direct pushes to main
  push:
    branches: [main]

# Cancel in-progress runs for the same PR/branch when new commits arrive
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: apps/server
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      # `!cancelled()` => typecheck + test still run even if lint failed,
      # so a single CI run surfaces every problem. Job fails if any step fails.
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: bun run typecheck

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: bun run test

  k8s-manifests:
    name: Kustomize build check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # kubectl bundles a kustomize build (`kubectl kustomize`) — cheap,
      # no cluster needed, just renders the overlay and fails on invalid
      # references (bad patch targets, missing resources, etc).
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Render overlays/local
        run: kubectl kustomize infra/k8s/overlays/local > /dev/null
